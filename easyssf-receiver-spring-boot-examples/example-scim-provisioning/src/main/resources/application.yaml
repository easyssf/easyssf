server:
  port: 8083

spring:
  application:
    name: example-scim-provisioning

easyssf:
  receiver:
    # The transmitter is the demo transmitter the application starts itself (Keycloak does not emit
    # SCIM Events): ExampleScimProvisioningApplication sets transmitter-issuer to its address. For a
    # real SCIM service provider, set transmitter-issuer, the token and the delivery method here.
    transmitter-access-token: transmitter-access-token
    delivery-method: poll
    poll:
      interval: 2s
      initial-delay: 1s
    # the application registers its own POLL stream on startup and asks for the SCIM Events it
    # mirrors; the transmitter assigns the audience of the SETs
    stream:
      management: receiver
      events-requested:
        - ScimFeedAdd
        - ScimFeedRemove
        - ScimProvCreateFull
        - ScimProvCreateNotice
        - ScimProvPatchFull
        - ScimProvPatchNotice
        - ScimProvPutFull
        - ScimProvPutNotice
        - ScimProvDelete
        - ScimProvActivate
        - ScimProvDeactivate
      description: example-scim-provisioning

logging:
  level:
    org.easyssf: info
    org.easyssf.examples: debug
