server:
  port: 8082

spring:
  application:
    name: example-oidc-client
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: example-oidc-client
            client-secret: ${KEYCLOAK_CLIENT_SECRET:example-oidc-client-secret}
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/ssf-demo}

easyssf:
  receiver:
    # Keycloak is both the identity provider and the SSF transmitter
    transmitter-issuer: ${spring.security.oauth2.client.provider.keycloak.issuer-uri}
    # the application registers its own PUSH stream on startup, Keycloak assigns the audience
    stream:
      management: receiver
      events-requested: CaepSessionRevoked, CaepCredentialChange
      description: example-oidc-client
    push:
      endpoint-path: /ssf/push
      # how Keycloak (in Docker) reaches the push endpoint, must be allowed by 'ssf.validPushUrls' of the client
      delivery-endpoint-url: ${SSF_PUSH_URL:http://host.docker.internal:8082/ssf/push}
      # the stream is created with this authorization header, Keycloak sends it with every SET
      expected-auth-header: Bearer example-oidc-client-push-secret
    # the service account of the client manages the stream
    oauth2:
      token-uri: ${spring.security.oauth2.client.provider.keycloak.issuer-uri}/protocol/openid-connect/token
      client-id: ${spring.security.oauth2.client.registration.keycloak.client-id}
      client-secret: ${spring.security.oauth2.client.registration.keycloak.client-secret}
      scopes: ssf.read, ssf.manage
    oidc-client:
      # Which events end local sessions (alias or event type URI, these are the defaults).
      # Keycloak only delivers the events the stream requested.
      # events that end the session named by the event, or all sessions of the user if it names none
      session-event-types: CaepSessionRevoked
      # events that end all sessions of the user
      user-event-types: CaepCredentialChange

logging:
  level:
    org.easyssf: debug
