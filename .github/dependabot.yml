# Keeps the Maven dependencies and the GitHub Actions current. The conformance suite images are
# named in easyssf-receiver-spring-boot-conformance-tests's ConformanceSettings and are not covered: check the registry
# for a new release by hand.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # nimbus-jose-jwt is pinned to the version Spring Security of the pinned Spring Boot ships (see
      # nimbus-jose-jwt.version in the root POM), so that a Spring Boot application resolves one
      # Nimbus whichever dependency it declares first. A Quarkus application gets the version of its
      # BOM regardless. The pin moves together with the Spring Boot bump, not on its own.
      - dependency-name: "com.nimbusds:nimbus-jose-jwt"
      # The Maven wrapper stays on 3.9.x: Maven 3.10 (Resolver 2) writes _remote.repositories marker
      # files into the staging directory of the central-publishing-maven-plugin, and Central rejects
      # the bundle ("Bundle has content that does NOT have a .pom file"). Lift this once the plugin
      # (0.11.0 as of 2026-10-04) excludes them, see CONTRIBUTING.md.
      - dependency-name: "org.apache.maven:apache-maven"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      spring:
        patterns:
          - "org.springframework*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "*:*-maven-plugin"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
