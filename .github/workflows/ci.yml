# Builds every module and runs the unit and integration tests. The conformance tests against the
# OpenID conformance suite are tagged and excluded by the normal build, see conformance.yml.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Later: run for every pull request. Before enabling, decide who may trigger a run under
  # Settings > Actions > General > "Fork pull request workflows" / "Approval for running
  # workflows from outside collaborators".
  # pull_request:
  #   branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
        experimental: [false]
        include:
          # the newest JDK: a failure does not fail the build until Mockito's Byte Buddy
          # supports its class file version without the experimental switch
          - java: 27
            experimental: true
    name: Java ${{ matrix.java }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify -Dbytebuddy.experimental=${{ matrix.experimental }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
          retention-days: 14

  # Publishes the snapshots of main to the Central snapshot repository once the tests pass. Off until
  # the repository variable PUBLISH_SNAPSHOTS is "true" (Settings > Secrets and variables > Actions).
  publish-snapshot:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_SNAPSHOTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish snapshots
        run: ./mvnw -B --no-transfer-progress -Prelease -DskipTests deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
